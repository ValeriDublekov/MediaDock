services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediadock}
      POSTGRES_USER: ${POSTGRES_USER:-mediadock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in next/.env or the host environment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-mediadock-next-api}
    build:
      context: .
      dockerfile: server/Dockerfile
      target: api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MediaDock: "Host=db;Port=5432;Database=${POSTGRES_DB:-mediadock};Username=${POSTGRES_USER:-mediadock};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in next/.env or the host environment}"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    restart: unless-stopped

  migrate:
    image: ${API_IMAGE:-mediadock-next-api}
    build:
      context: .
      dockerfile: server/Dockerfile
      target: api
    command: ["--migrate", "true"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MediaDock: "Host=db;Port=5432;Database=${POSTGRES_DB:-mediadock};Username=${POSTGRES_USER:-mediadock};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in next/.env or the host environment}"
    profiles:
      - tools
    restart: "no"

  worker:
    image: ${WORKER_IMAGE:-mediadock-next-worker}
    build:
      context: .
      dockerfile: server/Dockerfile
      target: worker
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__MediaDock: "Host=db;Port=5432;Database=${POSTGRES_DB:-mediadock};Username=${POSTGRES_USER:-mediadock};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in next/.env or the host environment}"
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      OMDB_DAILY_REQUEST_LIMIT: ${OMDB_DAILY_REQUEST_LIMIT:-}
      OSCAR_ENRICHMENT_MAX_FILMS_PER_RUN: ${OSCAR_ENRICHMENT_MAX_FILMS_PER_RUN:-0}
      OSCAR_ENRICHMENT_MAX_REQUESTS_PER_DAY: ${OSCAR_ENRICHMENT_MAX_REQUESTS_PER_DAY:-0}
    profiles:
      - worker
    restart: "no"

volumes:
  postgres_data: