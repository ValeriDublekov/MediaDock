[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "movies-feed"
version = "0.1.0"
description = "MediaDock backend scanner and title parser"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0.0",
    "requests>=2.25.0",
    "firebase-admin>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
