name: Daily Scanner

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run scanner in dry-run mode (no Firestore writes)"
        type: boolean
        required: false
        default: false
      force_days:
        description: "Force scan entries N days back (0 = disabled)"
        type: string
        required: false
        default: "0"
      audit_days:
        description: "Audit existing records N days back (0 = unlimited)"
        type: string
        required: false
        default: "0"
      mode:
        description: "Scan mode: rss, recheck-existing, reparse-unfound, all, or apply-proposals"
        type: choice
        required: false
        default: "rss"
        options:
          - "rss"
          - "recheck-existing"
          - "reparse-unfound"
          - "all"
          - "apply-proposals"
      proposal_id:
        description: "One previously approved proposal ID (apply-proposals only)"
        type: string
        required: false
        default: ""
      backup_confirmation:
        description: "Enter BACKUP_CONFIRMED before production application"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: scanner-run
  cancel-in-progress: false

jobs:
  scan:
    name: Run Media Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.lock"

      - name: Install Python package and dependencies
        run: |
          python -m pip install --requirement backend/requirements.lock
          python -m pip install --no-deps --editable ./backend

      - name: Decode Firebase Service Account Credentials
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.config/gcloud
          CRED_PATH="$HOME/.config/gcloud/firebase_service_account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > "$CRED_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED_PATH" >> $GITHUB_ENV

      - name: Execute Scanner
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCANNER_DRY_RUN: ${{ inputs.dry_run }}
          SCANNER_FORCE_DAYS: ${{ inputs.force_days }}
          SCANNER_AUDIT_DAYS: ${{ inputs.audit_days }}
          SCANNER_MODE: ${{ inputs.mode }}
          SCANNER_PROPOSAL_ID: ${{ inputs.proposal_id }}
          SCANNER_BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}
          SCANNER_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          dry_run="${SCANNER_DRY_RUN:-false}"
          force_days="${SCANNER_FORCE_DAYS:-0}"
          audit_days="${SCANNER_AUDIT_DAYS:-0}"
          mode="${SCANNER_MODE:-rss}"
          proposal_id="${SCANNER_PROPOSAL_ID:-}"
          backup_confirmation="${SCANNER_BACKUP_CONFIRMATION:-}"
          event_name="${SCANNER_EVENT_NAME:-schedule}"

          case "$dry_run" in
            true|false) ;;
            *) printf '%s\n' 'dry_run must be true or false' >&2; exit 1 ;;
          esac
          if ! [[ "$force_days" =~ ^[0-9]+$ ]] || (( force_days > 30 )); then
            printf '%s\n' 'force_days must be a decimal integer from 0 to 30' >&2
            exit 1
          fi
          if ! [[ "$audit_days" =~ ^[0-9]+$ ]] || (( audit_days > 30 )); then
            printf '%s\n' 'audit_days must be a decimal integer from 0 to 30' >&2
            exit 1
          fi
          case "$mode" in
            rss|recheck-existing|reparse-unfound|all|apply-proposals) ;;
            *) printf '%s\n' 'mode is not supported' >&2; exit 1 ;;
          esac

          scanner_args=(--config legacy/config.json --mode "$mode" --force-days "$force_days" --audit-days "$audit_days")
          if [[ "$mode" == "apply-proposals" ]]; then
            if [[ "$event_name" != "workflow_dispatch" ]]; then
              printf '%s\n' 'apply-proposals is available only through manual dispatch' >&2
              exit 1
            fi
            if [[ -z "$proposal_id" ]]; then
              printf '%s\n' 'proposal_id is required for apply-proposals' >&2
              exit 1
            fi
            scanner_args+=(--proposal-id "$proposal_id")
            if [[ "$dry_run" != "true" ]]; then
              if [[ "$backup_confirmation" != "BACKUP_CONFIRMED" ]]; then
                printf '%s\n' 'backup_confirmation must equal BACKUP_CONFIRMED' >&2
                exit 1
              fi
            fi
          elif [[ -n "$proposal_id" || -n "$backup_confirmation" ]]; then
            printf '%s\n' 'proposal inputs are supported only with apply-proposals' >&2
            exit 1
          fi
          if [[ "$dry_run" == "true" ]]; then
            scanner_args+=(--dry-run)
          fi
          python -m movies_feed.cli "${scanner_args[@]}"
