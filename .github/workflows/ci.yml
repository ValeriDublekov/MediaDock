name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.lock"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python package and dependencies
        run: |
          python -m pip install --requirement backend/requirements.lock
          python -m pip install --no-deps --editable ./backend
          python -m pip check

      - name: Validate workflow security contract
        run: python -m unittest discover -s backend/tests -p "test_workflow_security.py" -v

      - name: Run backend tests
        run: npx firebase emulators:exec --project demo-mediadock "python -m unittest discover -s backend/tests -v"

  frontend-ci:
    name: Frontend Test, Typecheck, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest unit tests
        run: npx vitest run src/test

      - name: Run Firestore security rules tests
        run: npx firebase emulators:exec --project demo-mediadock "npx vitest run firebase/tests/rules.test.ts"

      - name: Build frontend
        run: npm run build
