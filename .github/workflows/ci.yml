name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python package and dependencies
        run: pip install -e ./backend

      - name: Run backend tests
        run: npx firebase emulators:exec "python -m unittest discover -s backend/tests -v"

  frontend-ci:
    name: Frontend Test, Typecheck, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest unit tests
        run: npx vitest run src/test

      - name: Run Firestore security rules tests
        run: npx firebase emulators:exec "npx vitest run firebase/tests/rules.test.ts"

      - name: Build frontend
        run: npm run build
